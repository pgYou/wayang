name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run only"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('npm >= 11.5.1 required'); process.exit(1); }" "$(npm --version)"

      - run: npm ci

      - name: Verify tag matches apps/cli package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(node -p "require('./apps/cli/package.json').version")"
          echo "tag=$TAG cli-version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match apps/cli version $VERSION"
            exit 1
          fi

      - run: npm run lint
      - run: npm test
      - run: npm run build
      # 构建产物经 turbo 产出 apps/cli/dist（cli.js / server-entry.js /
      # mcp-bridge-entry.js），publish 从 apps/cli 目录打包该 dist。

      - name: Check whether this version is already published
        id: check
        run: |
          VERSION="$(node -p "require('./apps/cli/package.json').version")"
          if npm view "@wayang-ai/cli@$VERSION" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@wayang-ai/cli@$VERSION already published, skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve dist-tag from version
        # prerelease 版本（如 1.0.0-alpha.1）默认也会打 latest tag，会把 latest 从 0.9.9 顶掉；
        # 按 prerelease 首段派生 tag：1.0.0-alpha.1 → alpha、1.0.0-beta.2 → beta、1.0.0-rc.1 → rc，
        # 正式版（版本无 '-' 段）仍走 latest。tag 名形如 semver 时 npm 会拒绝发布，提前失败。
        # tag push：版本取自 tag 本身（GITHUB_REF_NAME 去 v 前缀）；workflow_dispatch 在分支上
        # 没有 tag，回退读 apps/cli/package.json（dry-run 演练路径）。
        id: disttag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./apps/cli/package.json').version")"
          fi
          PRE="$(node -p "const v = process.argv[1]; const i = v.indexOf('-'); i >= 0 ? v.slice(i + 1).split('.')[0] : ''" "$VERSION")"
          if [ -n "$PRE" ]; then
            DIST_TAG="$PRE"
          else
            DIST_TAG="latest"
          fi
          case "$DIST_TAG" in
            [0-9]* | v[0-9]*)
              echo "::error::dist-tag '$DIST_TAG' looks like a semver version; npm rejects such tags — use a named channel (alpha/beta/rc/next)"
              exit 1
              ;;
          esac
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION → dist-tag $DIST_TAG"

      - name: Publish to npm (DRY RUN — no upload)
        # dry-run 仅用于 workflow_dispatch（inputs.dry_run 默认 true）；push tag 不走这条。
        if: steps.check.outputs.exists == 'false' && (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        working-directory: apps/cli
        run: npm publish --provenance --access public --dry-run --tag "${{ steps.disttag.outputs.dist-tag }}"

      - name: Publish to npm (LIVE — uploads to registry)
        # push v* tag 走这里：直接正式发布到 npm，没有 dry-run 兜底。
        if: steps.check.outputs.exists == 'false' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        working-directory: apps/cli
        run: |
          echo "LIVE PUBLISH: event=${GITHUB_EVENT_NAME} version=$(node -p "require('./package.json').version") dist-tag=${{ steps.disttag.outputs.dist-tag }}"
          npm publish --provenance --access public --tag "${{ steps.disttag.outputs.dist-tag }}"
