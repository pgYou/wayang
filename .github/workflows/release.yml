name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run only"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && (b<5 || (b===5 && c<1)))) { console.error('npm >= 11.5.1 required'); process.exit(1); }" "$(npm --version)"

      - run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Check whether this version is already published
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "wayang-ai@$VERSION" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "wayang-ai@$VERSION already published, skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve dist-tag from version
        # prerelease 版本（如 1.0.0-alpha.0）默认也会打 latest tag，会把 latest 从 0.9.8 顶掉；
        # 按 prerelease 首段取 tag（alpha / beta / rc），正式版仍走 latest。
        id: disttag
        run: |
          PRE="$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] || ''")"
          if [ -n "$PRE" ]; then
            DIST_TAG="$PRE"
          else
            DIST_TAG="latest"
          fi
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version") → dist-tag $DIST_TAG"

      - name: Publish to npm (DRY RUN — no upload)
        # dry-run 仅用于 workflow_dispatch（inputs.dry_run 默认 true）；push tag 不走这条。
        if: steps.check.outputs.exists == 'false' && (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: npm publish --provenance --access public --dry-run --tag "${{ steps.disttag.outputs.dist-tag }}"

      - name: Publish to npm (LIVE — uploads to registry)
        # push v* tag 走这里：直接正式发布到 npm，没有 dry-run 兜底。
        if: steps.check.outputs.exists == 'false' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        run: |
          echo "LIVE PUBLISH: event=${GITHUB_EVENT_NAME} version=$(node -p "require('./package.json').version") dist-tag=${{ steps.disttag.outputs.dist-tag }}"
          npm publish --provenance --access public --tag "${{ steps.disttag.outputs.dist-tag }}"
