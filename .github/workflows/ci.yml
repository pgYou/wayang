name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由根 package.json 的 packageManager 字段锁定（corepack 读取）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        # Node 20 已进入 actions runner 的 deprecation 警告期（Node 20 EOL 后镜像逐步退役）。
        # 仅记录不修：升级需同步评估 engines（>=20）与 e2e 基线，另行处理。
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (type check + eslint)
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: E2E tests (against dist)
        run: pnpm exec vitest run --config e2e.config.ts
