name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        # Node 20 已进入 actions runner 的 deprecation 警告期（Node 20 EOL 后镜像逐步退役）。
        # 仅记录不修：升级需同步评估 engines（>=20）与 e2e 基线，另行处理。
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (type check + eslint)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests (against dist)
        run: npx vitest run --config e2e.config.ts
